<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winter Watch – Council Roads Team</title>
<style>
  :root{--bg:#eceff2;--card:#fff;--ink:#1f2933;--mute:#616e7c;--line:#d9dee4;--chip:#e4e8ec;--slate:#3e4c59;--accent:#2f5d8a;--accent-ink:#fff;--warn:#b42318;--ok:#067647;--amber:#b54708;--shadow:0 1px 2px rgba(31,41,51,.06),0 2px 8px rgba(31,41,51,.04)}
  @media (prefers-color-scheme:dark){:root{--bg:#12171d;--card:#1b222b;--ink:#e6ebf2;--mute:#9aa7b8;--line:#2c3744;--chip:#27313d;--slate:#c3ccd6;--accent:#7db0e6;--accent-ink:#0f1720;--warn:#ff8a80;--ok:#5fd39a;--amber:#f5b25c;--shadow:none}}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  .ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
  header{position:relative;overflow:hidden;padding:20px 24px;background:linear-gradient(135deg,#2a343e 0%,#46535f 100%);color:#fff;border-bottom:4px solid var(--accent)}
  header h1{margin:0;font-size:24px;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
  header h1 .ic{width:1.3em;height:1.3em}
  header p{margin:4px 0 0;color:#c9d2dc;font-size:13.5px}
  header .deco{position:absolute;right:-10px;top:-18px;width:150px;height:150px;opacity:.10;stroke-width:1}
  header .deco2{position:absolute;right:150px;top:34px;width:64px;height:64px;opacity:.12;stroke-width:1.2}
  header .deco3{position:absolute;right:250px;top:-8px;width:36px;height:36px;opacity:.10;stroke-width:1.4}
  main{max-width:1180px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:18px}
  section,details.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
  .title{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .title .chip{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--slate);color:#fff;flex:none}
  @media (prefers-color-scheme:dark){.title .chip{background:var(--chip);color:var(--accent)}}
  .title h2{margin:0;font-size:18px;font-weight:750;letter-spacing:.2px;color:var(--ink)}
  .title .kick{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mute);font-weight:650}
  section.lead{border-top:4px solid var(--accent)}
  summary{cursor:pointer;font-weight:650;display:flex;align-items:center;gap:8px;color:var(--slate)}
  label{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 3px;font-weight:600}
  input,select,textarea,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  input,select,textarea{width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}
  textarea{min-height:92px;resize:vertical}
  button{cursor:pointer;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:6px}
  button.secondary{background:var(--card);color:var(--slate);border-color:var(--line)}
  button.secondary:hover{background:var(--chip)}
  button:disabled{opacity:.5;cursor:wait}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .row>div{flex:1;min-width:200px}
  .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--slate);font-weight:700;background:var(--chip);position:sticky;top:0}
  th[data-k]{cursor:pointer;user-select:none}
  th[data-k]:hover{color:var(--accent)}
  tbody tr:nth-child(even) td{background:rgba(127,140,155,.06)}
  tfoot td{font-weight:700;border-top:2px solid var(--slate);background:var(--chip)}
  tr.rt{cursor:pointer}
  tr.rt:hover td{background:rgba(47,93,138,.10)}
  tr.hi td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
  tr.mid td:first-child{box-shadow:inset 4px 0 0 var(--amber)}
  tr.lo td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
  .flag{font-weight:700}.flag.hi{color:var(--warn)}.flag.mid{color:var(--amber)}.flag.lo{color:var(--ok)}
  .small{font-size:12px;color:var(--mute)}
  .err{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;margin-top:8px}
  .qa{border:1px solid var(--line);border-left:4px solid var(--slate);border-radius:10px;padding:12px 14px;margin-top:14px;background:var(--bg)}
  .qa .q{font-weight:700;color:var(--slate)}
  .answer{white-space:pre-wrap;word-break:break-word;margin-top:8px;color:var(--ink)}
  .usage{margin-top:10px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:13px;background:var(--card)}
  pre.plan{white-space:pre-wrap;max-height:340px;overflow:auto;font-size:12.5px;background:var(--bg);padding:12px;border-radius:8px;border:1px solid var(--line)}
  .notice{font-size:13px;color:var(--mute);background:var(--chip);border-radius:8px;padding:8px 12px;display:flex;gap:8px;align-items:flex-start}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:6px 0 14px}
  .tile{background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--slate);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
  .tile.hi{border-top-color:var(--warn)}.tile.mid{border-top-color:var(--amber)}.tile.lo{border-top-color:var(--ok)}
  .tl{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);font-weight:700;display:flex;gap:6px;align-items:center}
  .tv{font-size:26px;font-weight:750;line-height:1.2}
  .ts{font-size:12px;color:var(--mute)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .fchip{background:var(--card);color:var(--slate);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
  .fchip.on{background:var(--slate);color:#fff;border-color:var(--slate)}
  @media (prefers-color-scheme:dark){.fchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}}
  .live{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .live label{margin:0;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--slate)}
  .live input{width:auto}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 2s infinite}
  .dot.off{background:var(--mute);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(6,118,71,.5)}70%{box-shadow:0 0 0 7px rgba(6,118,71,0)}100%{box-shadow:0 0 0 0 rgba(6,118,71,0)}}
  .bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:90px}
  .bar>i{display:block;height:100%;background:var(--ok)}
  .bar.short>i{background:var(--warn)}
  tr.detail td{background:var(--bg)!important;white-space:normal}
